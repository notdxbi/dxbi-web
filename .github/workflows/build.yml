# Builds Stremio's open-source web app (stremio-web, GPL-2.0) at a pinned release and publishes it on
# GitHub Pages, so dx.bi runs on its own copy instead of web.stremio.com. To update: change
# STREMIO_WEB_REF, push, and test before pointing the apps at the new build.
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  # every day: the site picks up the latest dx.bi release
  schedule:
    - cron: "40 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  STREMIO_WEB_REF: v5.0.0-beta.43

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get stremio-web ${{ env.STREMIO_WEB_REF }}
        uses: actions/checkout@v4
        with:
          repository: Stremio/stremio-web
          ref: ${{ env.STREMIO_WEB_REF }}
          fetch-depth: 1
      - name: Get dx.bi (latest release) and this repository's branding
        run: |
          tag=$(curl -fsSL https://api.github.com/repos/notdxbi/dxbi-stremio/releases/latest | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'])")
          echo "DXBI_TAG=$tag" >> "$GITHUB_ENV"
          git clone -q --depth 1 --branch "$tag" https://github.com/notdxbi/dxbi-stremio.git ../dxbi-stremio
          git clone -q --depth 1 https://github.com/${{ github.repository }}.git ../branding
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate
          pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Dress it as dx.bi (name, icons, dx.bi built in)
        run: |
          python3 ../branding/tools/brand.py build ../dxbi-stremio ../branding
          grep -q 'dxbi/web.js' build/index.html
          grep -q '"name": "dx.bi"' build/manifest.json
      - name: Record what was built
        run: |
          echo "dx.bi ${DXBI_TAG} on stremio-web ${STREMIO_WEB_REF} ($(git rev-parse HEAD)), built $(date -u +%FT%TZ)" > build/dxbi-web-version.txt
          ls build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
